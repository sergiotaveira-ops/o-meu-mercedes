syntax = "proto3";

package proto;
option java_package = "pt.sergiotaveira.mercedes.proto";
option java_outer_classname = "ClientProto";
option java_multiple_files = true;

import "protos.proto";
import "service-activation.proto";
import "user-events.proto";
import "vehicle-commands.proto";
import "vehicle-events.proto";
import "vehicleapi.proto";

message ClientMessage {
  reserved 8;
  string tracking_id = 5;
  .proto.SocketHeader header = 27;
  oneof msg {
    .proto.UnsubscribeRequest unsubscribeRequest = 2;
    .proto.CommandRequest commandRequest = 3;
    .proto.TrackingEvent tracking_event = 4;
    .proto.ConfigurePingInterval ping_interval = 6;
    .proto.AcknowledgeVEPRequest acknowledge_vep_request = 7;
    .proto.AcknowledgeServiceStatusUpdatesByVIN acknowledge_service_status_updates_by_vin = 9;
    .proto.AcknowledgeServiceStatusUpdate acknowledge_service_status_update = 13;
    .proto.AcknowledgeUserDataUpdate acknowledge_user_data_update = 10;
    .proto.AcknowledgeUserPictureUpdate acknowledge_user_picture_update = 11;
    .proto.AcknowledgeUserPINUpdate acknowledge_user_pin_update = 12;
    .proto.UpdateUserJWTRequest update_user_jwt_request = 14;
    .proto.AcknowledgeUserVehicleAuthChangedUpdate acknowledge_user_vehicle_auth_changed_update = 15;
    .proto.AcknowledgeAbilityToGetVehicleMasterDataFromRestAPI acknowledge_ability_to_get_vehicle_master_data_from_rest_api = 16;
    .proto.AcknowledgeVehicleUpdated acknowledge_vehicle_updated = 17;
    .proto.AcknowledgePreferredDealerChange acknowledge_preferred_dealer_change = 18;
    .proto.AcknowledgeAppTwinCommandStatusUpdatesByVIN acknowledge_apptwin_command_status_update_by_vin = 19;
    .proto.Logout logout = 20;
    .proto.AppTwinPendingCommandsResponse apptwin_pending_commands_response = 21;
    .proto.AcknowledgeVEPUpdatesByVIN acknowledge_vep_updates_by_vin = 22;
    .proto.AcknowledgeAssignedVehicles acknowledge_assigned_vehicles = 23;
    .proto.AcknowledgeDataChangeEvent acknowledge_data_change_event = 26;
    .proto.AcknowledgeVehicleStatusUpdates acknowledge_vehicle_status_updates = 28;
    .proto.RefreshVehicleStatus refresh_vehicle_status = 29;
    .proto.AcknowledgeCommandCapabilitiesUpdate acknowledge_command_capabilities_update = 30;
    .proto.AcknowledgeRefreshVehicleStatusUpdates acknowledge_refresh_vehicle_status_updates = 31;
  }
}
message Logout {
}
